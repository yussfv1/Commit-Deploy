<svg xmlns="http://www.w3.org/2000/svg" width="420" height="80" viewBox="0 8 420 80">
  <!-- Поле обрезано по буквам (y 8…88), справа запас 30 px: меню вписывает логотип в 400 × 96,
       и при такой пропорции он получается 400 × 76 и не наезжает на подзаголовок под ним. -->
  <!-- Логотип T-MINUS. Буквы — линии одной толщины со скруглёнными концами, как линии на схеме метро.
       Тире — оранжевая «ветка» со станцией: отсюда стартует ракета. Шрифты не используются: всё нарисовано вручную. -->
  <g fill="none" stroke="#e8eef7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- T -->
    <path d="M6 14 H52 M29 14 V82"/>
    <!-- M -->
    <path d="M116 82 V14 L143 52 L170 14 V82"/>
    <!-- I -->
    <path d="M190 14 V82"/>
    <!-- N -->
    <path d="M210 82 V14 L256 82 V14"/>
    <!-- U -->
    <path d="M276 14 V58 A23 23 0 0 0 322 58 V14"/>
    <!-- S -->
    <path d="M385 25 C381 17 373 14 364 14 C352 14 342 21 342 31 C342 42 353 46 364 48 C376 50 387 55 387 65 C387 76 376 82 364 82 C354 82 345 78 341 70"/>
  </g>
  <!-- Оранжевое тире-ветка со станцией. Зазоры T → тире и станция → M по 8, как между остальными буквами. -->
  <path d="M72 48 H92.5" stroke="#ff7a2f" stroke-width="12" stroke-linecap="round"/>
  <circle cx="92.5" cy="48" r="7" fill="#0f1b2d" stroke="#ff7a2f" stroke-width="5"/>
</svg>
