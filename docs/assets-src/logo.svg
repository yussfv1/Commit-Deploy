<svg xmlns="http://www.w3.org/2000/svg" width="452" height="176" viewBox="0 8 452 176">
  <!-- Поле обрезано по буквам: две строки по 68 (y 14…82 и 110…178) плюс полтолщины линии. Меню вписывает
       логотип в 400 × 120, при такой пропорции он получается около 308 × 120 и не наезжает на подзаголовок. -->
  <!-- Логотип Commit & Deploy (до 12.11 игра называлась T-MINUS). Буквы — линии одной толщины со скруглёнными
       концами, как линии на схеме метро; округлые буквы (C, O, U, D) — из полуокружностей радиуса 23.
       Знак «&» — оранжевая ветка: тот же акцент, что был у тире в старом логотипе. Шрифты не используются. -->
  <g fill="none" stroke="#e8eef7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Строка 1: COMMIT. Шаг между буквами — 20 между краями линий, как в старом логотипе. -->
    <!-- C -->
    <path d="M52 37 A23 23 0 0 0 6 37 V59 A23 23 0 0 0 52 59"/>
    <!-- O -->
    <path d="M72 37 V59 A23 23 0 0 0 118 59 V37 A23 23 0 0 0 72 37 Z"/>
    <!-- M -->
    <path d="M138 82 V14 L165 52 L192 14 V82"/>
    <!-- M -->
    <path d="M212 82 V14 L239 52 L266 14 V82"/>
    <!-- I -->
    <path d="M286 14 V82"/>
    <!-- T -->
    <path d="M306 14 H352 M329 14 V82"/>
    <!-- Строка 2: DEPLOY -->
    <!-- D -->
    <path d="M6 110 H20 A32 34 0 0 1 20 178 H6 Z"/>
    <!-- E -->
    <path d="M116 110 H72 V178 H116 M72 144 H108"/>
    <!-- P -->
    <path d="M136 178 V110 H158 A22 17 0 0 1 158 144 H136"/>
    <!-- L -->
    <path d="M200 110 V178 H240"/>
    <!-- O -->
    <path d="M260 133 V155 A23 23 0 0 0 306 155 V133 A23 23 0 0 0 260 133 Z"/>
    <!-- Y -->
    <path d="M326 110 L349 144 L372 110 M349 144 V178"/>
  </g>
  <!-- Оранжевый «&» после COMMIT: верхняя петля, диагональ вниз, нижняя чаша и хвост вправо. -->
  <path d="M440 82 L408 42 C400 32 402 14 416 14 C428 14 432 26 426 34 L406 52 C396 62 400 82 416 82 C426 82 434 74 440 62"
        fill="none" stroke="#ff7a2f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
