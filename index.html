<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Commit &amp; Deploy — Покажи один раз</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%230f1b2d'/%3E%3Cpath d='M32 9c8 9 10 18 10 27v12H22V36c0-9 2-18 10-27z' fill='%23e9eef5'/%3E%3Cpath d='M32 9c4 5 7 10 8.6 15H23.4C25 19 28 14 32 9z' fill='%23ff7a2f'/%3E%3Cpath d='M22 40l-7 12 7-3zM42 40l7 12-7-3z' fill='%23ff7a2f'/%3E%3C/svg%3E"
    />
    <style>
      /* Шрифт роли C (public/assets/fonts/main.woff2) игра подключает сама, только если файл есть в сборке
         (src/render/assets.ts). Поэтому без файла браузер его не запрашивает и в консоли нет ошибки. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #09111b;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
        outline: none;
      }
      noscript {
        display: block;
        padding: 40px;
        color: #e6edf5;
        font: 18px Bahnschrift, 'PT Sans', 'Segoe UI', Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <noscript>Для игры нужен JavaScript. Включите его в настройках браузера.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
